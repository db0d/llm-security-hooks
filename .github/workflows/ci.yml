name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv + Python 3.14
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.14"
          enable-cache: false

      - name: Syntax-check hook scripts
        run: |
          python3.14 -m py_compile hooks/security/*.py
          bash -n install.sh

      - name: Hooks-only dry install (project mode)
        run: |
          mkdir -p /tmp/llm-hooks-smoke
          ./install.sh --hooks-only --project /tmp/llm-hooks-smoke
          test -f /tmp/llm-hooks-smoke/.cursor/hooks.json
          test -x /tmp/llm-hooks-smoke/.cursor/hooks/security/post_edit_scan.py
