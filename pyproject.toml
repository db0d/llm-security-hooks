[project]
name = "llm-security-hooks"
version = "0.1.0"
description = "Security hooks for LLM coding agents (Cursor first), with a cross-platform installer."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "db0d" }]
keywords = ["cursor", "security", "hooks", "sast", "sca", "secrets"]
dependencies = []

[project.optional-dependencies]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hooks"]
